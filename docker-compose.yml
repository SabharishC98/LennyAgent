services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lenny:lenny@db:5432/lenny
      AGENT_URL: http://agent:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_PORT: "8001"
      AGENT_HOST: "0.0.0.0"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: http://api:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lenny:lenny@db:5432/lenny
      TRANSCRIPT_PATH: /transcripts
    volumes:
      - ../lennys-podcast-transcripts:/transcripts:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles:
      - ingest

volumes:
  pgdata:
